server.port = 8080
spring.application.name=commesse
spring.application.version = 0.1

# Database MySql connection - CORRETTO per ambiente locale
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/gestione_commesse?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=commesse
spring.datasource.password=commesse
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=1800000

# Server context path
server.servlet.context-path=/commesse-0.0.1-SNAPSHOT

# Logging
logging.level.org.springframework=INFO
logging.level.com.medialogic=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# DEBUG logging per vedere i controller
logging.level.org.springframework.web.servlet.mvc=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.medialogic=TRACE

