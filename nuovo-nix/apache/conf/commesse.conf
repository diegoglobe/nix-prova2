# VIRTUAL HOST per Portale Commesse
# Riproduzione esatta configurazione produzione (semplificata)

Listen 127.0.0.1:9090

<VirtualHost 127.0.0.1:9090>
    ServerName localhost
    
    # Directory document root (come produzione: /var/www/commesse)
    DocumentRoot "/home/commesse/nuovo-nix/apache/www"
    
    <Directory "/home/commesse/nuovo-nix/apache/www">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Rewrite per Angular Router
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ /index.html [L]
    </Directory>
    
    # Log files (come produzione)
    ErrorLog "/home/commesse/nuovo-nix/apache/logs/commesse-error.log"
    CustomLog "/home/commesse/nuovo-nix/apache/logs/commesse-access.log" combined
    
    # REVERSE PROXY per Spring Boot (COME PRODUZIONE)
    ProxyPreserveHost On
    ProxyPass /commesse-0.0.1-SNAPSHOT http://localhost:8080/commesse-0.0.1-SNAPSHOT
    ProxyPassReverse /commesse-0.0.1-SNAPSHOT http://localhost:8080/commesse-0.0.1-SNAPSHOT
    
    # CORS headers (come produzione)
    Header always set Access-Control-Allow-Origin "http://localhost:9090"
    Header always set Access-Control-Allow-Credentials "true"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    
    <Location "/commesse-0.0.1-SNAPSHOT/api">
        Header always set Access-Control-Allow-Origin "http://localhost:9090"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
    </Location>
</VirtualHost>
