# Apache HTTP Server Configuration for Nix
# Complete with all required modules

ServerRoot "/nix/store/8p6dj27q9lp216wj5hh79kd0w0ycnln9-apache-httpd-2.4.59"

# ========== LOAD ESSENTIAL MODULES ==========
# MPM Module (REQUIRED - fixes "No MPM loaded")
LoadModule mpm_event_module modules/mod_mpm_event.so

# Core modules
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_groupfile_module modules/mod_authz_groupfile.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule filter_module modules/mod_filter.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule version_module modules/mod_version.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule status_module modules/mod_status.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so

# Proxy modules for reverse proxy
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_connect_module modules/mod_proxy_connect.so

# Additional required modules
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so

# ========== BASIC SETTINGS ==========
Listen 9090
ServerName localhost

# Logs
ErrorLog "/home/commesse/nuovo-nix/apache/logs/error.log"
CustomLog "/home/commesse/nuovo-nix/apache/logs/access.log" combined

# Document root
DocumentRoot "/home/commesse/nuovo-nix/apache/www"

<Directory "/home/commesse/nuovo-nix/apache/www">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    
    # Angular Router support
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^(.*)$ /index.html [L]
</Directory>

# ========== VIRTUAL HOST FOR COMMESSE APP ==========
<VirtualHost *:9090>
    ServerName localhost
    DocumentRoot "/home/commesse/nuovo-nix/apache/www"
    
    # Proxy configuration for Spring Boot
    ProxyRequests Off
    ProxyPreserveHost On
    
    ProxyPass /commesse-0.0.1-SNAPSHOT http://localhost:8080/commesse-0.0.1-SNAPSHOT
    ProxyPassReverse /commesse-0.0.1-SNAPSHOT http://localhost:8080/commesse-0.0.1-SNAPSHOT
    
    # CORS headers
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
    
    ErrorLog "/home/commesse/nuovo-nix/apache/logs/commesse-error.log"
    CustomLog "/home/commesse/nuovo-nix/apache/logs/commesse-access.log" combined
</VirtualHost>
